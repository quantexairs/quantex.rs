<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  .slide {
    width: 1080px; height: 1080px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 88px 96px;
    background: #060912;
    overflow: hidden;
  }
  /* Background gradient glow */
  .slide::before {
    content: '';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 800px; height: 500px;
    background: radial-gradient(ellipse, rgba(59,130,246,0.13) 0%, rgba(6,182,212,0.05) 50%, transparent 75%);
    pointer-events: none;
  }
  /* Top + bottom accent lines */
  .slide::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4, transparent);
  }
  .logo-wrap {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 60px;
    position: relative; z-index: 1;
  }
  .logo-text {
    font-size: 30px; font-weight: 900;
    letter-spacing: -0.02em; color: #f1f5f9;
  }
  .logo-sub {
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.2em; color: #60a5fa;
    text-transform: uppercase; display: block; margin-top: 2px;
  }
  .cta-headline {
    font-size: 64px; font-weight: 900;
    line-height: 1.1; letter-spacing: -0.025em;
    color: #f1f5f9;
    max-width: 820px;
    margin-bottom: 28px;
    position: relative; z-index: 1;
  }
  .cta-headline .accent {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cta-body {
    font-size: 26px; color: #94a3b8; line-height: 1.6;
    max-width: 680px; margin-bottom: 56px;
    position: relative; z-index: 1;
  }
  .contact-block {
    display: flex; flex-direction: column; gap: 16px; align-items: center;
    position: relative; z-index: 1;
  }
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; color: #f1f5f9;
  }
  .contact-item .icon {
    width: 44px; height: 44px;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #60a5fa;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="logo-wrap">
    <svg width="52" height="52" viewBox="-2 -2 66 66" fill="none">
      <circle cx="31" cy="31" r="24" stroke="#3b82f6" stroke-width="1.6" opacity="0.9"/>
      <line x1="47" y1="47" x2="58" y2="58" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="31" y1="7" x2="55" y2="31" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
      <line x1="55" y1="31" x2="31" y2="55" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
      <line x1="31" y1="7" x2="7" y2="31" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
      <line x1="7" y1="31" x2="31" y2="55" stroke="#60a5fa" stroke-width="0.8" opacity="0.5"/>
      <circle cx="31" cy="7"  r="2.5" fill="#bfdbfe"/>
      <circle cx="55" cy="31" r="2"   fill="#93c5fd"/>
      <circle cx="31" cy="55" r="2"   fill="#93c5fd"/>
      <circle cx="7"  cy="31" r="2"   fill="#93c5fd"/>
      <circle cx="31" cy="31" r="3.2" fill="white"/>
      <circle cx="58" cy="58" r="2.2" fill="#60a5fa"/>
    </svg>
    <div>
      <span class="logo-text">QUANTEX</span>
      <span class="logo-sub">AI Automation Agency</span>
    </div>
  </div>

  <h2 class="cta-headline">Spremni da počnete?<br/><span class="accent">besplatno</span></h2>

  
  <p class="cta-body">Zakažite besplatan analitički razgovor na quantex.rs. Za 30 minuta ćemo zajedno proceniti gde AI donosi najveći uticaj u vašem biznisu.</p>
  

  <div class="contact-block">
    <div class="contact-item">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
      </span>
      quantex.rs
    </div>
    <div class="contact-item">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      office@quantex.rs
    </div>
  </div>
</div>
</body>
</html>
