<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1080px;
    overflow: hidden; background: #060912;
    font-family: 'Inter', sans-serif;
  }
  .slide {
    width: 1080px; height: 1080px;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 88px 96px;
    background: #060912;
    overflow: hidden;
  }
  /* Subtle grid pattern */
  .slide::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }
  /* Glow */
  .slide::after {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(ellipse, rgba(59,130,246,0.18) 0%, rgba(6,182,212,0.08) 40%, transparent 70%);
    pointer-events: none;
  }
  .category-badge {
    display: inline-flex; align-items: center;
    padding: 8px 20px;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 999px;
    font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: #60a5fa;
    margin-bottom: 36px;
    position: relative; z-index: 1;
  }
  .headline {
    font-size: 72px; font-weight: 900;
    line-height: 1.08; letter-spacing: -0.03em;
    color: #f1f5f9;
    max-width: 820px;
    position: relative; z-index: 1;
    margin-bottom: 32px;
  }
  .headline .accent {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 26px; font-weight: 400;
    color: #94a3b8; line-height: 1.55;
    max-width: 700px;
    position: relative; z-index: 1;
  }
  /* Gradient line accent */
  .accent-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #3b82f6, #06b6d4, transparent);
  }
  /* Logo + swipe indicator */
  .bottom-bar {
    position: absolute;
    bottom: 72px; left: 96px; right: 96px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 2;
  }
  .logo-area {
    display: flex; align-items: center; gap: 14px;
  }
  .logo-text {
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.02em; color: #f1f5f9;
  }
  .logo-sub {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.18em; color: #60a5fa;
    text-transform: uppercase;
    display: block; margin-top: 1px;
  }
  .swipe-hint {
    font-size: 19px; color: #64748b;
    display: flex; align-items: center; gap: 8px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="accent-line"></div>

  <span class="category-badge">Interni procesi</span>

  <h1 class="headline">
    
      Onboarding od 3 nedelje sveden na 5 dana<br/><span class="accent">Kako AI menja način na koji firme uvode nove zaposlene</span>
    
  </h1>

  

  <div class="bottom-bar">
    <div class="logo-area">
      <svg width="44" height="44" viewBox="-2 -2 66 66" fill="none">
        <circle cx="31" cy="31" r="24" stroke="#3b82f6" stroke-width="1.6" opacity="0.9"/>
        <line x1="47" y1="47" x2="58" y2="58" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="31" y1="7" x2="55" y2="31" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
        <line x1="55" y1="31" x2="31" y2="55" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
        <line x1="31" y1="7" x2="7" y2="31" stroke="#60a5fa" stroke-width="0.9" opacity="0.6"/>
        <line x1="7" y1="31" x2="31" y2="55" stroke="#60a5fa" stroke-width="0.8" opacity="0.5"/>
        <circle cx="31" cy="7"  r="2.5" fill="#bfdbfe"/>
        <circle cx="55" cy="31" r="2"   fill="#93c5fd"/>
        <circle cx="31" cy="55" r="2"   fill="#93c5fd"/>
        <circle cx="7"  cy="31" r="2"   fill="#93c5fd"/>
        <circle cx="31" cy="31" r="3.2" fill="white"/>
        <circle cx="58" cy="58" r="2.2" fill="#60a5fa"/>
      </svg>
      <div>
        <span class="logo-text">QUANTEX</span>
        <span class="logo-sub">AI Automation Agency</span>
      </div>
    </div>
    <span class="swipe-hint">Prevuci <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
  </div>
</div>
</body>
</html>
