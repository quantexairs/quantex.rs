<a href="{{ post.slug }}.html" class="blog-card animate-on-scroll">
  <div class="blog-card-thumb" style="background: {{ post.card_gradient }};" aria-hidden="true">
    <svg class="blog-card-thumb-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">{{ post.card_icon }}</svg>
  </div>
  <div class="blog-card-body">
    <div class="blog-card-meta"><span class="blog-card-category">{{ post.category }}</span><span class="blog-card-read-time">{{ post.reading_time }} min čitanja</span></div>
    <h2 class="blog-card-title">{{ post.title }}</h2>
    <p class="blog-card-excerpt">{{ post.excerpt }}</p>
    <div class="blog-card-footer">
      <span class="blog-card-date">{{ post.date_display }}</span>
      <svg class="blog-card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </div>
</a>
