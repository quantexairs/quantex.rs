<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1c3a"/>
    </linearGradient>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#gl)"/>

  <!-- Connecting line -->
  <line x1="130" y1="145" x2="670" y2="145" stroke="rgba(59,130,246,0.3)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Step circles + labels -->
  <!-- Step 1 -->
  <circle cx="130" cy="145" r="42" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="138" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="white" text-anchor="middle">1</text>
  <text x="130" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Analiza</text>
  <text x="130" y="205" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">Mapiranje</text>
  <text x="130" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">procesa</text>

  <!-- Step 2 -->
  <circle cx="310" cy="145" r="42" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="2"/>
  <text x="310" y="138" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="white" text-anchor="middle">2</text>
  <text x="310" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Plan</text>
  <text x="310" y="205" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">Priprema</text>
  <text x="310" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">podataka</text>

  <!-- Step 3 -->
  <circle cx="490" cy="145" r="42" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="2"/>
  <text x="490" y="138" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="white" text-anchor="middle">3</text>
  <text x="490" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">Razvoj</text>
  <text x="490" y="205" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" text-anchor="middle">Gradnja</text>
  <text x="490" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">i testiranje</text>

  <!-- Step 4 -->
  <circle cx="670" cy="145" r="42" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="670" y="138" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="white" text-anchor="middle">4</text>
  <text x="670" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">Lansiranje</text>
  <text x="670" y="205" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#67e8f9" text-anchor="middle">Sistem radi</text>
  <text x="670" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">za vas</text>

  <!-- Arrows between steps -->
  <g fill="#60a5fa" opacity="0.5">
    <polygon points="180,142 196,138 196,152"/>
    <polygon points="360,142 376,138 376,152"/>
    <polygon points="540,142 556,138 556,152"/>
  </g>

  <!-- Timeline text -->
  <text x="400" y="272" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Prosečno 6 do 10 sedmica od prvog razgovora do živog sistema</text>
</svg>
