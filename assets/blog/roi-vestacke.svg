<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="gl" cx="60%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#gl)"/>

  <!-- Baseline -->
  <line x1="150" y1="240" x2="680" y2="240" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Horizontal grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="150" y1="190" x2="680" y2="190"/>
    <line x1="150" y1="140" x2="680" y2="140"/>
    <line x1="150" y1="90" x2="680" y2="90"/>
  </g>

  <!-- Bars -->
  <rect x="195" y="210" width="70" height="30" rx="4" fill="url(#bar1)" opacity="0.7"/>
  <rect x="305" y="185" width="70" height="55" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="415" y="130" width="70" height="110" rx="4" fill="url(#bar2)" opacity="0.85"/>
  <rect x="525" y="75" width="70" height="165" rx="4" fill="url(#bar2)"/>

  <!-- Bar labels (value) -->
  <text x="230" y="205" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#93c5fd" text-anchor="middle">12%</text>
  <text x="340" y="178" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#93c5fd" text-anchor="middle">34%</text>
  <text x="450" y="123" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" fill="#67e8f9" text-anchor="middle">78%</text>
  <text x="560" y="68" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="16" fill="white" text-anchor="middle">147%</text>

  <!-- X labels -->
  <text x="230" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mesec 1</text>
  <text x="340" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mesec 3</text>
  <text x="450" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mesec 6</text>
  <text x="560" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Mesec 12</text>

  <!-- Trend arrow -->
  <path d="M 230 215 Q 395 160 558 82" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6 3"/>
  <polygon points="558,82 548,90 562,92" fill="#06b6d4" opacity="0.6"/>

  <!-- Right label -->
  <text x="668" y="95" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="26" fill="#06b6d4" text-anchor="middle">↑</text>
  <text x="668" y="112" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">prinos na</text>
  <text x="668" y="126" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ulaganje</text>
</svg>
