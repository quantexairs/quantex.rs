<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1a30"/>
    </linearGradient>
    <radialGradient id="gl" cx="55%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#gl)"/>

  <!-- Document stack (back) -->
  <rect x="80" y="90" width="220" height="155" rx="8" fill="rgba(30,41,59,0.6)" stroke="rgba(100,116,139,0.3)" stroke-width="1" transform="rotate(-4, 190, 165)"/>
  <rect x="80" y="88" width="220" height="155" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(100,116,139,0.4)" stroke-width="1" transform="rotate(-2, 190, 165)"/>
  <!-- Front document -->
  <rect x="78" y="85" width="220" height="155" rx="8" fill="rgba(15,23,42,0.9)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <!-- Document content lines -->
  <line x1="102" y1="112" x2="274" y2="112" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="102" y1="128" x2="240" y2="128" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="102" y1="142" x2="260" y2="142" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="102" y1="156" x2="220" y2="156" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="102" y1="170" x2="250" y2="170" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="102" y1="184" x2="200" y2="184" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Folder label -->
  <text x="188" y="225" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Pravilnici, procedure, uputstva</text>

  <!-- Highlight line (active search) -->
  <rect x="102" y="122" width="138" height="14" rx="2" fill="rgba(59,130,246,0.2)"/>
  <text x="171" y="133" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">§ 4.2 — Godišnji odmor</text>

  <!-- Arrow from doc to chat -->
  <path d="M 310 165 Q 370 165 380 155" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="5 3"/>
  <polygon points="378,149 386,157 374,160" fill="#3b82f6" opacity="0.5"/>

  <!-- Chat bubble: question -->
  <rect x="370" y="68" width="245" height="60" rx="12" fill="rgba(30,41,59,0.8)" stroke="rgba(100,116,139,0.3)" stroke-width="1"/>
  <polygon points="390,128 405,140 420,128" fill="rgba(30,41,59,0.8)"/>
  <text x="492" y="92" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Koliko dana godišnjeg</text>
  <text x="492" y="110" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">odmora imam ove godine?</text>

  <!-- Chat bubble: answer -->
  <rect x="370" y="162" width="330" height="80" rx="12" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <polygon points="390,162 405,148 420,162" fill="rgba(59,130,246,0.15)"/>
  <circle cx="392" cy="195" r="8" fill="rgba(59,130,246,0.3)"/>
  <text x="392" y="199" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">AI</text>
  <text x="540" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Imate pravo na 20 radnih dana</text>
  <text x="540" y="206" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">prema kolektivnom ugovoru</text>
  <text x="540" y="224" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Izvor: Pravilnik o radu, § 4.2</text>

  <!-- Instant response indicator -->
  <text x="680" y="268" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#06b6d4" text-anchor="end">Odgovor: odmah ↑</text>
</svg>
