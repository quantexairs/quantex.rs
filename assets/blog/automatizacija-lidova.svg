<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="gl" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="funnel-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#gl)"/>

  <!-- Funnel shape -->
  <polygon points="220,55 580,55 500,170 300,170" fill="url(#funnel-g)" opacity="0.25"/>
  <polygon points="300,175 500,175 460,245 340,245" fill="url(#funnel-g)" opacity="0.35"/>
  <!-- Funnel borders -->
  <polygon points="220,55 580,55 500,170 300,170" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
  <polygon points="300,175 500,175 460,245 340,245" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>

  <!-- Incoming dots (top) -->
  <g fill="#60a5fa" opacity="0.7">
    <circle cx="290" cy="38" r="4"/><circle cx="340" cy="30" r="3.5"/><circle cx="390" cy="28" r="4"/>
    <circle cx="440" cy="31" r="3.5"/><circle cx="490" cy="36" r="4"/><circle cx="260" cy="44" r="3"/>
    <circle cx="520" cy="42" r="3"/><circle cx="365" cy="22" r="3"/>
  </g>
  <!-- Arrows from dots to funnel -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.3">
    <line x1="290" y1="42" x2="300" y2="53"/><line x1="390" y1="32" x2="390" y2="53"/>
    <line x1="490" y1="40" x2="480" y2="53"/>
  </g>

  <!-- Label top -->
  <text x="400" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle" opacity="0.8">Sve kompanije u ciljanom segmentu</text>

  <!-- Qualified output dot (bottom) -->
  <circle cx="400" cy="265" r="10" fill="#06b6d4" opacity="0.9"/>
  <path d="M 400 255 L 400 248" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Right side text -->
  <text x="620" y="110" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="white">Identifikacija</text>
  <text x="620" y="130" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">pravih kompanija</text>
  <text x="620" y="168" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="white">Kontakt</text>
  <text x="620" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">personalizovana poruka</text>
  <text x="620" y="226" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="15" fill="#06b6d4">Kvalifikovani lid</text>
  <text x="620" y="246" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">spreman za prodaju</text>

  <!-- Connecting lines to labels -->
  <line x1="582" y1="112" x2="610" y2="112" stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="502" y1="172" x2="610" y2="172" stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="462" y1="242" x2="610" y2="232" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
</svg>
