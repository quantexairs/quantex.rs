<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1c3a"/>
    </linearGradient>
    <radialGradient id="glL" cx="25%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glR" cx="75%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#glL)"/>
  <rect width="800" height="300" fill="url(#glR)"/>

  <!-- Left panel: ChatGPT (generic) -->
  <rect x="50" y="50" width="300" height="200" rx="12" fill="none" stroke="rgba(99,102,241,0.35)" stroke-width="1.5"/>
  <text x="70" y="82" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#a5b4fc" letter-spacing="0.5">Generički AI alat</text>
  <!-- Chat bubbles -->
  <rect x="70" y="96" width="160" height="28" rx="8" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
  <text x="84" y="115" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#c7d2fe">Opšti odgovor na pitanje</text>
  <rect x="110" y="136" width="180" height="28" rx="8" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="124" y="155" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a5b4fc">Ne zna vaš poslovni kontekst</text>
  <rect x="70" y="176" width="140" height="28" rx="8" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
  <text x="84" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#c7d2fe">Nema akcije</text>

  <!-- VS divider -->
  <line x1="400" y1="40" x2="400" y2="260" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="400" cy="150" r="24" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="400" y="155" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="white" text-anchor="middle">VS</text>

  <!-- Right panel: AI Agent -->
  <rect x="450" y="50" width="300" height="200" rx="12" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
  <text x="470" y="82" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#67e8f9" letter-spacing="0.5">Prilagođeni AI agent</text>
  <!-- Nodes -->
  <circle cx="510" cy="125" r="18" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="510" y="130" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">CRM</text>
  <circle cx="590" cy="110" r="18" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="590" y="115" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">Kalendar</text>
  <circle cx="665" cy="130" r="18" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="665" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">Email</text>
  <circle cx="590" cy="195" r="18" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="590" y="200" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">Akcija</text>
  <line x1="528" y1="125" x2="572" y2="115" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
  <line x1="608" y1="115" x2="647" y2="127" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
  <line x1="590" y1="128" x2="590" y2="177" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
</svg>
