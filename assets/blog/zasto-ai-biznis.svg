<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1c3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#glow1)"/>
  <rect width="800" height="300" fill="url(#glow2)"/>

  <!-- dot grid -->
  <g opacity="0.05">
    <pattern id="d" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white"/>
    </pattern>
    <rect width="800" height="300" fill="url(#d)"/>
  </g>

  <!-- 7 connected nodes representing 7 reasons -->
  <!-- Central hub -->
  <circle cx="200" cy="150" r="28" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.7"/>
  <circle cx="200" cy="150" r="8" fill="#3b82f6" opacity="0.8"/>
  <text x="200" y="154" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="10" fill="white" text-anchor="middle">AI</text>

  <!-- 7 satellite nodes in a ring -->
  <g>
    <!-- Node 1 - top -->
    <circle cx="200" cy="55" r="10" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>
    <circle cx="200" cy="55" r="4" fill="#bfdbfe" opacity="0.7"/>
    <line x1="200" y1="122" x2="200" y2="65" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 2 - top-right -->
    <circle cx="286" cy="78" r="10" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>
    <circle cx="286" cy="78" r="4" fill="#bfdbfe" opacity="0.7"/>
    <line x1="224" y1="132" x2="276" y2="84" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 3 - right -->
    <circle cx="310" cy="160" r="10" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>
    <circle cx="310" cy="160" r="4" fill="#bfdbfe" opacity="0.7"/>
    <line x1="228" y1="150" x2="300" y2="158" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 4 - bottom-right -->
    <circle cx="275" cy="232" r="10" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <circle cx="275" cy="232" r="4" fill="#a5f3fc" opacity="0.7"/>
    <line x1="218" y1="172" x2="268" y2="224" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 5 - bottom -->
    <circle cx="200" cy="248" r="10" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <circle cx="200" cy="248" r="4" fill="#a5f3fc" opacity="0.7"/>
    <line x1="200" y1="178" x2="200" y2="238" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 6 - bottom-left -->
    <circle cx="120" cy="225" r="10" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <circle cx="120" cy="225" r="4" fill="#a5f3fc" opacity="0.7"/>
    <line x1="182" y1="170" x2="128" y2="218" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <!-- Node 7 - top-left -->
    <circle cx="112" cy="82" r="10" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity="0.5"/>
    <circle cx="112" cy="82" r="4" fill="#bfdbfe" opacity="0.7"/>
    <line x1="178" y1="134" x2="120" y2="90" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Inter-node connections (subtle web) -->
  <g stroke="#3b82f6" stroke-width="0.4" opacity="0.15">
    <line x1="200" y1="55" x2="286" y2="78"/>
    <line x1="286" y1="78" x2="310" y2="160"/>
    <line x1="310" y1="160" x2="275" y2="232"/>
    <line x1="275" y1="232" x2="200" y2="248"/>
    <line x1="200" y1="248" x2="120" y2="225"/>
    <line x1="120" y1="225" x2="112" y2="82"/>
    <line x1="112" y1="82" x2="200" y2="55"/>
  </g>

  <!-- Right side content -->
  <text x="440" y="95" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="56" fill="white" opacity="0.95">7</text>
  <text x="500" y="95" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="28" fill="#94a3b8">razloga</text>
  <text x="441" y="130" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="16" fill="#60a5fa" letter-spacing="0.5">koji menjaju način</text>
  <text x="441" y="154" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="16" fill="#60a5fa" letter-spacing="0.5">poslovanja</text>

  <!-- Mini metric cards -->
  <rect x="440" y="180" width="120" height="48" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <text x="455" y="202" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#60a5fa">78%</text>
  <text x="455" y="218" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="10" fill="#64748b">automatizovano</text>

  <rect x="575" y="180" width="120" height="48" rx="8" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <text x="590" y="202" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#22d3ee">4 mes.</text>
  <text x="590" y="218" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="10" fill="#64748b">ROI period</text>

  <!-- Decorative arc -->
  <path d="M 440 260 Q 570 245 720 270" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.2"/>
  <circle cx="440" cy="260" r="2.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="720" cy="270" r="2.5" fill="#06b6d4" opacity="0.4"/>
</svg>
