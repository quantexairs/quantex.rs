<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0c1c3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#glow1)"/>
  <rect width="800" height="300" fill="url(#glow2)"/>

  <!-- dot grid -->
  <g opacity="0.05">
    <pattern id="d" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="white"/>
    </pattern>
    <rect width="800" height="300" fill="url(#d)"/>
  </g>

  <!-- Chat bubble (large, left) -->
  <rect x="80" y="60" width="220" height="80" rx="16" fill="none" stroke="#3b82f6" stroke-width="1.8" opacity="0.6"/>
  <polygon points="130,140 145,160 160,140" fill="none" stroke="#3b82f6" stroke-width="1.8" opacity="0.6"/>
  <!-- Lines inside bubble -->
  <rect x="100" y="80" width="140" height="6" rx="3" fill="#3b82f6" opacity="0.3"/>
  <rect x="100" y="96" width="100" height="6" rx="3" fill="#3b82f6" opacity="0.2"/>
  <rect x="100" y="112" width="120" height="6" rx="3" fill="#3b82f6" opacity="0.15"/>

  <!-- Chat bubble (small, reply) -->
  <rect x="160" y="168" width="160" height="60" rx="14" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="260,228 275,246 290,228" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <rect x="178" y="185" width="90" height="5" rx="3" fill="#06b6d4" opacity="0.3"/>
  <rect x="178" y="198" width="120" height="5" rx="3" fill="#06b6d4" opacity="0.2"/>

  <!-- AI brain icon (center) -->
  <circle cx="190" cy="150" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="250" cy="195" r="3" fill="#22d3ee" opacity="0.7"/>

  <!-- Connecting dots -->
  <line x1="194" y1="150" x2="247" y2="195" stroke="#3b82f6" stroke-width="0.8" opacity="0.3"/>

  <!-- Right side: stat -->
  <text x="440" y="100" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="60" fill="white" opacity="0.95">85%</text>
  <text x="441" y="134" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="16" fill="#60a5fa" letter-spacing="0.8">upita rešeno automatski</text>
  <text x="441" y="158" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">bez ljudske intervencije</text>

  <!-- 24/7 badge -->
  <rect x="440" y="185" width="80" height="34" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <text x="480" y="207" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#60a5fa" text-anchor="middle">24/7</text>

  <text x="540" y="200" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="13" fill="#64748b">dostupnost</text>

  <!-- Decorative arcs -->
  <path d="M 440 240 Q 560 220 700 250" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.25"/>
  <circle cx="440" cy="240" r="2.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="700" cy="250" r="2.5" fill="#06b6d4" opacity="0.4"/>
</svg>
