<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#060912"/>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Q outer circle -->
  <circle cx="30" cy="30" r="20" stroke="#3b82f6" stroke-width="1.4" opacity="0.9" filter="url(#glow)"/>

  <!-- Q tail -->
  <line x1="44" y1="44" x2="54" y2="54" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" filter="url(#glow2)"/>

  <!-- Internal network lines -->
  <line x1="10" y1="30" x2="50" y2="30" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="30" y1="10" x2="30" y2="50" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="16" y1="16" x2="44" y2="44" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="44" y1="16" x2="16" y2="44" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>

  <!-- Constellation spokes -->
  <line x1="30" y1="10" x2="50" y2="30" stroke="#60a5fa" stroke-width="0.85" opacity="0.5"/>
  <line x1="50" y1="30" x2="30" y2="50" stroke="#60a5fa" stroke-width="0.85" opacity="0.5"/>
  <line x1="30" y1="10" x2="10" y2="30" stroke="#60a5fa" stroke-width="0.85" opacity="0.5"/>
  <line x1="10" y1="30" x2="30" y2="50" stroke="#60a5fa" stroke-width="0.75" opacity="0.4"/>

  <!-- Inner hexagon ring -->
  <line x1="30" y1="18" x2="40" y2="24" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="18" x2="20" y2="24" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="40" y1="24" x2="40" y2="36" stroke="#93c5fd" stroke-width="0.7" opacity="0.45"/>
  <line x1="20" y1="24" x2="20" y2="36" stroke="#93c5fd" stroke-width="0.7" opacity="0.45"/>
  <line x1="40" y1="36" x2="30" y2="42" stroke="#93c5fd" stroke-width="0.7" opacity="0.45"/>
  <line x1="20" y1="36" x2="30" y2="42" stroke="#93c5fd" stroke-width="0.7" opacity="0.45"/>

  <!-- Outer nodes -->
  <circle cx="30" cy="10" r="2.2" fill="#bfdbfe" filter="url(#glow2)"/>
  <circle cx="44" cy="16" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="50" cy="30" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="44" cy="44" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="30" cy="50" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="16" cy="44" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="10" cy="30" r="1.8" fill="#93c5fd" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="1.8" fill="#93c5fd" filter="url(#glow)"/>

  <!-- Inner hexagon nodes -->
  <circle cx="30" cy="18" r="1.5" fill="#dbeafe" filter="url(#glow)"/>
  <circle cx="40" cy="24" r="1.5" fill="#dbeafe" filter="url(#glow)"/>
  <circle cx="40" cy="36" r="1.5" fill="#dbeafe" filter="url(#glow)"/>
  <circle cx="30" cy="42" r="1.5" fill="#dbeafe" filter="url(#glow)"/>
  <circle cx="20" cy="36" r="1.5" fill="#dbeafe" filter="url(#glow)"/>
  <circle cx="20" cy="24" r="1.5" fill="#dbeafe" filter="url(#glow)"/>

  <!-- Center node -->
  <circle cx="30" cy="30" r="3" fill="white" filter="url(#glow2)"/>

  <!-- Q tail endpoint -->
  <circle cx="54" cy="54" r="2" fill="#60a5fa" filter="url(#glow2)"/>
</svg>
